<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divisor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e10600" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e10600" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { animation: p 4s ease-in-out infinite; }
      .runner { animation: r 6s linear infinite; }
      @keyframes p { 0%,100% { opacity:.45;} 50% { opacity:1;} }
      @keyframes r { 0% { transform:translateX(-160px);} 100% { transform:translateX(1200px);} }
      @media (prefers-reduced-motion: reduce) { .pulse,.runner { animation:none; } }
    </style>
  </defs>
  <rect class="pulse" x="0" y="11" width="1200" height="1.6" fill="url(#d)"/>
  <g class="runner">
    <circle cx="0" cy="12" r="3" fill="#ff5a5a"/>
    <rect x="-150" y="11.2" width="150" height="1.6" fill="#ff5a5a" opacity=".35"/>
  </g>
  <path d="M594 12 L600 3 L606 12 L600 21 Z" fill="#3a0004" stroke="#e10600" stroke-width="1"/>
</svg>
