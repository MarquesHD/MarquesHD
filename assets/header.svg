<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="MarquesHD - Desenvolvedor e Pentester de Redes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2a2a" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#e00d0d" stop-opacity=".95"/>
      <stop offset="62%"  stop-color="#8c0000" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2a0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="20%" cy="55%" r="85%">
      <stop offset="0%"   stop-color="#2a0104"/>
      <stop offset="60%"  stop-color="#0d0203"/>
      <stop offset="100%" stop-color="#040000"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e10600" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#e10600" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff2d2d" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff2d2d" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="rim"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glint" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="10"/></clipPath>
    <clipPath id="typeA"><rect x="470" y="196" width="0" height="36"><animate attributeName="width" values="0;0;420;420" keyTimes="0;0.16;0.60;1" dur="6.5s" repeatCount="indefinite"/></rect></clipPath>

    <path id="thorn" d="M-4.6 6 C-2.6 -18 -1.4 -44 0 -84 C1.4 -44 2.6 -18 4.6 6 Z"/>
    <g id="figure">
      <path d="M175 130 C168 178 152 202 132 226 C108 254 96 288 92 336 H388 C384 288 372 254 348 226 C328 202 312 178 305 130 Z"/>
      <ellipse cx="240" cy="134" rx="74" ry="19"/>
      <path d="M175 132 C186 100 202 86 240 86 C278 86 294 100 305 132 Z"/>
      <use href="#thorn" transform="rotate(-52 240 178) translate(240 108)"/>
      <use href="#thorn" transform="rotate(-39 240 178) translate(240 104) scale(1.08)"/>
      <use href="#thorn" transform="rotate(-26 240 178) translate(240 100) scale(.92)"/>
      <use href="#thorn" transform="rotate(-13 240 178) translate(240 98) scale(1.12)"/>
      <use href="#thorn" transform="rotate(0 240 178) translate(240 96) scale(1.02)"/>
      <use href="#thorn" transform="rotate(13 240 178) translate(240 98) scale(1.14)"/>
      <use href="#thorn" transform="rotate(26 240 178) translate(240 100) scale(.9)"/>
      <use href="#thorn" transform="rotate(39 240 178) translate(240 104) scale(1.06)"/>
      <use href="#thorn" transform="rotate(52 240 178) translate(240 108)"/>
    </g>
    <style>
      .halo   { animation: breathe 5.5s ease-in-out infinite; transform-origin: 240px 176px; }
      .glint  { animation: flick 4.2s ease-in-out infinite; }
      .glint2 { animation: flick 4.2s ease-in-out infinite 1.7s; }
      .scanline { animation: sweep 7s linear infinite; }
      .caret  { animation: blink 1s steps(1) infinite; }
      .name   { letter-spacing: 9px; }
      @keyframes breathe { 0%,100% { opacity:.66; transform:scale(1);} 50% { opacity:1; transform:scale(1.05);} }
      @keyframes flick   { 0%,88%,100% { opacity:.12;} 92% { opacity:1;} 95% { opacity:.3;} }
      @keyframes sweep   { 0% { transform:translateY(-140px);} 100% { transform:translateY(480px);} }
      @keyframes blink   { 0%,49% { opacity:1;} 50%,100% { opacity:0;} }
      @media (prefers-reduced-motion: reduce) {
        .halo,.glint,.glint2,.scanline,.caret { animation:none; }
        .halo { opacity:.9; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#vign)"/>

    <g class="halo"><circle cx="240" cy="168" r="142" fill="url(#halo)" filter="url(#soft)"/></g>

    <use href="#figure" fill="#ff1717" filter="url(#rim)" opacity=".55"/>
    <use href="#figure" fill="#020000"/>

    <circle class="glint"  cx="240" cy="86"  r="2.6" fill="#ff7b7b" filter="url(#glint)"/>
    <circle class="glint2" cx="303" cy="112" r="2.1" fill="#ff7b7b" filter="url(#glint)"/>
    <circle class="glint2" cx="182" cy="120" r="1.9" fill="#ff7b7b" filter="url(#glint)"/>
    <circle class="glint"  cx="266" cy="150" r="1.7" fill="#ff7b7b" filter="url(#glint)"/>

    <text x="470" y="152" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="58" font-weight="700" fill="#f4e7e7" class="name">MarquesHD</text>
    <rect x="470" y="174" width="660" height="2" fill="url(#rule)"/>
    <g clip-path="url(#typeA)">
      <text x="470" y="223" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="23" fill="#ff4d4d">automação · sistemas · pentest de redes</text>
    </g>
    <rect class="caret" x="472" y="201" width="11" height="26" fill="#ff4d4d" opacity=".9"/>
    <text x="470" y="270" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" fill="#9b7272">Código que trabalha no escuro para o expediente correr na luz.</text>

    <rect class="scanline" x="0" y="0" width="1200" height="140" fill="url(#scan)"/>
    <rect x=".5" y=".5" width="1199" height="339" rx="10" fill="none" stroke="#5a0b10" stroke-width="1"/>
  </g>
</svg>
